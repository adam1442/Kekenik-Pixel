name: Bug report
description: Something is broken (app, build, installer, export, …)
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible —
        it makes fixing it much faster.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11 (x64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (deb)
        - Web browser
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kekenik Pixel version
      placeholder: "1.0.0 (Help → About, or the filename you downloaded)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour / error output
      render: shell
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS build & architecture
      placeholder: "Windows 11 23H2 · x64"
