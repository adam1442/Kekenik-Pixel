name: Release

# Builds every platform and publishes the artifacts to a GitHub Release.
#
#   • push a tag `v1.0.0` (or run the workflow manually)  ->  Release "v1.0.0"
#   • workflow_dispatch lets you run a dry build without publishing (draft = true)
#
# Artifacts produced:
#   Windows  : KekenikPixel-<version>-win-x64-setup.exe, ...-win-x64-portable.exe
#   macOS    : KekenikPixel-<version>-mac-x64.dmg/.zip, ...-mac-arm64.dmg/.zip  (unsigned)
#   Linux    : KekenikPixel-<version>-linux-x64.AppImage / .deb / .tar.gz
#   plus SHA256SUMS.txt for every artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # Unsigned macOS builds: skip keychain / certificate auto-discovery.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate: typecheck + tests + web bundle (single source of truth for quality)
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (typecheck · tests · web bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (including tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag matches package version and commit
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $EXPECTED"; exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$EXPECTED^{commit}" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "refs/tags/$EXPECTED^{commit}")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $EXPECTED already points to a different commit. Bump the version and create a new tag."; exit 1
            fi
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate:icons

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: Web production bundle + verification
        run: |
          npm run build:web
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p web-artifact
          cp dist/index.html "web-artifact/KekenikPixel-${VERSION}-web-bundle.html"

      - name: Upload web release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kekenik-pixel-web-release
          path: web-artifact/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Platform builds (native runners only – no wine, no cross-compiling)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            files: |
              release/*/KekenikPixel-*-win-*.exe
              release/*/KekenikPixel-*-win-*.exe.sha256
              release/*/SHA256SUMS.txt
          - name: macOS (x64 + arm64)
            os: macos-15
            command: npm run dist:mac
            artifact: macos
            files: |
              release/*/KekenikPixel-*-mac-*.dmg
              release/*/KekenikPixel-*-mac-*.zip
              release/*/KekenikPixel-*-mac-*.sha256
              release/*/KekenikPixel-*-mac-*.blockmap
              release/*/SHA256SUMS.txt
          - name: Linux x64
            os: ubuntu-22.04
            command: npm run dist:linux
            artifact: linux-x64
            files: |
              release/*/KekenikPixel-*-linux-x64.AppImage
              release/*/KekenikPixel-*-linux-x64.deb
              release/*/KekenikPixel-*-linux-x64.tar.gz
              release/*/KekenikPixel-*-linux-x64.*.sha256
              release/*/SHA256SUMS.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgtk-3-0 libfuse2 fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: ${{ matrix.command }}
        env:
          # Tests and the web bundle already ran in the `verify` job.
          # (The build script re-runs the full pipeline, which is intentional:
          #  every installer is produced from a fully verified tree.)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List produced artifacts
        shell: bash
        run: ls -lah release/*/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kekenik-pixel-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Publish every artifact to a single GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kekenik-pixel-*
          path: artifacts

      - name: Assemble and verify complete release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              *.sha256|SHA256SUMS.txt|*.blockmap|*.yml|*.yaml) continue ;;
            esac
            if [[ -e "release-assets/$name" ]]; then
              echo "::error::Duplicate artifact $name"; exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find artifacts -type f -print0)
          for suffix in \
            win-x64-setup.exe win-x64-portable.exe \
            mac-x64.dmg mac-x64.zip mac-arm64.dmg mac-arm64.zip \
            linux-x64.AppImage linux-x64.deb linux-x64.tar.gz web-bundle.html; do
            name="KekenikPixel-${VERSION}-${suffix}"
            if [[ ! -s "release-assets/$name" ]]; then
              echo "::error::Required artifact missing or empty: $name"; exit 1
            fi
          done
          cd release-assets
          for f in KekenikPixel-*; do sha256sum "$f" > "$f.sha256"; done
          sha256sum KekenikPixel-* > /tmp/kpx-all-sha
          grep -v '\.sha256$' /tmp/kpx-all-sha > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lah

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kekenik Pixel ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Kekenik Pixel ${{ steps.version.outputs.version }}

            Cross-platform pixel-art & sprite-animation editor.

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 (x64) | `KekenikPixel-${{ steps.version.outputs.version }}-win-x64-setup.exe` (installer) · `...-portable.exe` (no install) |
            | macOS (Apple Silicon) | `KekenikPixel-${{ steps.version.outputs.version }}-mac-arm64.dmg` |
            | macOS (Intel) | `KekenikPixel-${{ steps.version.outputs.version }}-mac-x64.dmg` |
            | Linux (x64) | `...-linux-x64.AppImage` · `.deb` · `.tar.gz` |
            | Web | `KekenikPixel-${{ steps.version.outputs.version }}-web-bundle.html` |

            **Verify your download** against `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt        # Linux
            shasum -a 256 -c SHA256SUMS.txt    # macOS
            Get-FileHash -Algorithm SHA256 .\KekenikPixel-*.exe   # Windows PowerShell
            ```

            > macOS builds are **not code-signed or notarized** yet. On first launch use
            > right-click → *Open*, or run
            > `xattr -dr com.apple.quarantine "/Applications/Kekenik Pixel.app"`.
          files: |
            release-assets/*
