name: Release

# Builds every platform and publishes the artifacts to a GitHub Release.
#
#   • push a tag `v1.0.0` (or run the workflow manually)  ->  Release "v1.0.0"
#   • workflow_dispatch lets you run a dry build without publishing (draft = true)
#
# Artifacts produced:
#   Windows  : KekenikPixel-<version>-win-x64-setup.exe, ...-win-x64-portable.exe
#   macOS    : KekenikPixel-<version>-mac-x64.dmg/.zip, ...-mac-arm64.dmg/.zip  (unsigned)
#   Linux    : KekenikPixel-<version>-linux-x64.AppImage / .deb / .tar.gz
#   plus SHA256SUMS.txt for every artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub Release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # Unsigned macOS builds: skip keychain / certificate auto-discovery.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate: typecheck + tests + web bundle (single source of truth for quality)
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (typecheck · tests · web bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate:icons

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test

      - name: Web production bundle + verification
        run: npm run build:web

  # ---------------------------------------------------------------------------
  # 2. Platform builds (native runners only – no wine, no cross-compiling)
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            files: |
              release/*/KekenikPixel-*-win-*.exe
              release/*/KekenikPixel-*-win-*.exe.sha256
              release/*/SHA256SUMS.txt
          - name: macOS (x64 + arm64)
            os: macos-14
            command: npm run dist:mac
            artifact: macos
            files: |
              release/*/KekenikPixel-*-mac-*.dmg
              release/*/KekenikPixel-*-mac-*.zip
              release/*/KekenikPixel-*-mac-*.sha256
              release/*/KekenikPixel-*-mac-*.blockmap
              release/*/SHA256SUMS.txt
          - name: Linux x64
            os: ubuntu-22.04
            command: npm run dist:linux
            artifact: linux-x64
            files: |
              release/*/KekenikPixel-*-linux-x64.AppImage
              release/*/KekenikPixel-*-linux-x64.deb
              release/*/KekenikPixel-*-linux-x64.tar.gz
              release/*/KekenikPixel-*-linux-x64.*.sha256
              release/*/SHA256SUMS.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgtk-3-0 libfuse2 fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: ${{ matrix.command }}
        env:
          # Tests and the web bundle already ran in the `verify` job.
          # (The build script re-runs the full pipeline, which is intentional:
          #  every installer is produced from a fully verified tree.)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List produced artifacts
        shell: bash
        run: ls -lah release/*/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kekenik-pixel-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Publish every artifact to a single GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute combined SHA256SUMS.txt
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f \
            ! -name "*.sha256" \
            ! -name "SHA256SUMS.txt" \
            ! -name "*.blockmap" \
            ! -name "*.yml" \
            -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          echo "--- files ---"
          ls -lah

      - name: Determine version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kekenik Pixel ${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Kekenik Pixel ${{ steps.version.outputs.version }}

            Cross-platform pixel-art & sprite-animation editor.

            | Platform | Download |
            | --- | --- |
            | Windows 10/11 (x64) | `KekenikPixel-${{ steps.version.outputs.version }}-win-x64-setup.exe` (installer) · `...-portable.exe` (no install) |
            | macOS (Apple Silicon) | `KekenikPixel-${{ steps.version.outputs.version }}-mac-arm64.dmg` |
            | macOS (Intel) | `KekenikPixel-${{ steps.version.outputs.version }}-mac-x64.dmg` |
            | Linux (x64) | `...-linux-x64.AppImage` · `.deb` · `.tar.gz` |

            **Verify your download** against `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt        # Linux
            shasum -a 256 -c SHA256SUMS.txt    # macOS
            Get-FileHash -Algorithm SHA256 .\KekenikPixel-*.exe   # Windows PowerShell
            ```

            > macOS builds are **not code-signed or notarized** yet. On first launch use
            > right-click → *Open*, or run
            > `xattr -dr com.apple.quarantine "/Applications/Kekenik Pixel.app"`.
          files: |
            artifacts/**/*
